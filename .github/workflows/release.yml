name: Publish GTA 5 RP HELPER

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, for example 1.0.0 or 1.0.1'
        required: true
        default: '1.0.0'
      replace_existing:
        description: 'Replace assets and source tag of an existing release without changing its version'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      RELEASE_VERSION: ${{ inputs.version }}
      REPLACE_EXISTING: ${{ inputs.replace_existing }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.3
      - name: Run tests
        run: python -m unittest discover -p "test_*.py"
      - name: Build and verify Windows distribution
        run: python launcher/build_portable.py --version "$env:RELEASE_VERSION" --repository "$env:GITHUB_REPOSITORY"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          GTA 5 RP HELPER $env:RELEASE_VERSION

          Download GTA-5-RP-HELPER-Windows-$env:RELEASE_VERSION.zip, extract the entire folder and launch GTA 5 RP HELPER.exe.
          Existing installations check for updates on startup and when clicking the refresh button.
          This build runs with normal user permissions. Running as administrator is optional.
          "@
          $notes | Set-Content -LiteralPath release-notes.txt -Encoding utf8
          $tag = "v$env:RELEASE_VERSION"
          $windows = "releases/$env:RELEASE_VERSION/GTA-5-RP-HELPER-Windows-$env:RELEASE_VERSION.zip"
          $package = "releases/$env:RELEASE_VERSION/carleone-helper-$env:RELEASE_VERSION.zip"
          $manifest = "releases/$env:RELEASE_VERSION/latest.json"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) {
            if ($env:REPLACE_EXISTING -ne 'true') { throw 'This release exists. Enable replace_existing only when intentionally replacing it.' }
            gh release upload $tag $windows $package --repo "$env:GITHUB_REPOSITORY" --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to replace release archives.' }
            gh release upload $tag $manifest --repo "$env:GITHUB_REPOSITORY" --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Failed to replace update manifest.' }
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f "sha=$env:GITHUB_SHA" -F force=true
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update source tag.' }
            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --notes-file release-notes.txt --latest
          } else {
            gh release create $tag $windows $package $manifest --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "GTA 5 RP HELPER $env:RELEASE_VERSION" --notes-file release-notes.txt --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release.' }
